services:
  db:
    image: postgres:16
    container_name: comfortzone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: comfortzone
      POSTGRES_PASSWORD: comfortzone
      POSTGRES_DB: comfortzone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
